<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Breathing Dot</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background-color: #2980b9;
      font-family: sans-serif;
    }

    .dot {
      position: fixed;
      border-radius: 50%;
      background-color: white;
      z-index: 10;
      transform-origin: center;
    }

    .label {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-weight: bold;
      text-align: center;
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="dot" id="dot"></div>
  <div class="label" id="label">inhale</div>

  <script>
    const dot = document.getElementById("dot");
    const label = document.getElementById("label");

    const durationPerSide = 4000;
    let currentSide = 0;
    let startTime = null;

    // const minSize = 8;
    //const maxSize = 24;
    const minSize = 36;
    const maxSize = 124;

    const labels = ["hold", "exhale", "hold", "inhale"]; // top, right, bottom, left

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function grayscaleToHex(value) {
      const hex = Math.round(value).toString(16).padStart(2, '0');
      return `#${hex}${hex}${hex}`;
    }

    function animate(time) {
      if (!startTime) startTime = time;
      const elapsed = time - startTime;
      const t = Math.min(elapsed / durationPerSide, 1);

      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // Size grows and shrinks in a smooth arc (bell curve)
      const sizeFactor = Math.sin(Math.PI * t);
      const dotSize = lerp(minSize, maxSize, sizeFactor);

      let x = 0, y = 0;

      switch (currentSide) {
        case 0: // Top
          x = lerp(0, vw - dotSize, t);
          y = 0;
          break;
        case 1: // Right
          x = vw - dotSize;
          y = lerp(0, vh - dotSize, t);
          break;
        case 2: // Bottom
          x = lerp(vw - dotSize, 0, t);
          y = vh - dotSize;
          break;
        case 3: // Left
          x = 0;
          y = lerp(vh - dotSize, 0, t);
          break;
      }

      // Update dot
      dot.style.width = `${dotSize}px`;
      dot.style.height = `${dotSize}px`;
      dot.style.transform = `translate(${x}px, ${y}px)`;
      dot.style.backgroundColor = grayscaleToHex(lerp(255, 0, t));

      // Update center label
      label.innerText = labels[currentSide];
      label.style.fontSize = `${lerp(36, 112, sizeFactor)}px`;

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        currentSide = (currentSide + 1) % 4;
        startTime = null;
        requestAnimationFrame(animate);
      }
    }

    requestAnimationFrame(animate);

    // Reset timing on resize
    window.addEventListener("resize", () => {
      startTime = null;
    });
  </script>
</body>
</html>
