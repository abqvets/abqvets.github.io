
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f1c2c" />
    <title>Breathe Motion</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body,
      html {
        height: 100%;
        background: radial-gradient(circle at top, #1f1c2c, #11101a 50%);
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .ball {
        position: absolute;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        box-shadow: 0 10px 45px rgba(255, 154, 158, 0.5);
        animation: move 16s linear infinite;
      }

      .breathe {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f7f1ff;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: 0.3rem;
        text-transform: lowercase;
        animation: pulse 16s linear infinite;
        pointer-events: none;
      }

      @keyframes move {
        0% {
          top: 0;
          left: 0;
          transform: translate(-50%, -50%) scale(0.5);
        }
        12.5% {
          top: 0;
          left: 50%;
          transform: translate(-50%, -50%) scale(1.8);
        }
        25% {
          top: 0;
          left: 100%;
          transform: translate(-50%, -50%) scale(0.5);
        }
        37.5% {
          top: 50%;
          left: 100%;
          transform: translate(-50%, -50%) scale(1.8);
        }
        50% {
          top: 100%;
          left: 100%;
          transform: translate(-50%, -50%) scale(0.5);
        }
        62.5% {
          top: 100%;
          left: 50%;
          transform: translate(-50%, -50%) scale(1.8);
        }
        75% {
          top: 100%;
          left: 0;
          transform: translate(-50%, -50%) scale(0.5);
        }
        87.5% {
          top: 50%;
          left: 0;
          transform: translate(-50%, -50%) scale(1.8);
        }
        100% {
          top: 0;
          left: 0;
          transform: translate(-50%, -50%) scale(0.5);
        }
      }

      @keyframes pulse {
        0% {
          transform: scale(0.75);
        }
        12.5% {
          transform: scale(1.1);
        }
        25% {
          transform: scale(0.75);
        }
        37.5% {
          transform: scale(1.1);
        }
        50% {
          transform: scale(0.75);
        }
        62.5% {
          transform: scale(1.1);
        }
        75% {
          transform: scale(0.75);
        }
        87.5% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ball" aria-hidden="true"></div>
      <div class="breathe">breathe</div>
    </div>
    <script>
      const label = document.querySelector('.breathe');
      const segmentDuration = 4000;
      const cycle = segmentDuration * 4;

      function updateLabel() {
        const now = performance.now();
        const segment = Math.floor(((now % cycle) + cycle) % cycle / segmentDuration);
        switch (segment) {
          case 0:
            label.textContent = 'breathe in';
            break;
          case 2:
            label.textContent = 'breathe out';
            break;
          default:
            label.textContent = 'hold';
        }
      }

      updateLabel();
      setInterval(updateLabel, 100);
    </script>
  </body>
</html>
