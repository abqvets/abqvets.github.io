  title: Heroes To Heroes Foundation
  url: www.heroestoheroes.org
  description: Heroes to Heroes Foundation provides spiritual healing and peer support for American Combat Veterans who have attempted suicide or are on a path to self-destruction due to moral injury. Participants report feelings of peace and a new sense of purpose. Solid peer support groups are formed, giving participants a sense of family and connectedness that lasts a lifetime.
