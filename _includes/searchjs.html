<body>

<h1>Search This Site</h1>

<input type="text" id="searchBox" placeholder="Search..." autocomplete="off" />
<div id="suggestions" class="dropdown" style="display:none;"></div>

<div class="filters">
  <div id="categoryFilters"><strong>Categories:</strong></div>
  <div id="tagFilters"><strong>Tags:</strong></div>
</div>

<div class="results" id="results"></div>

<script>
let index = [];
let categories = new Set();
let tags = new Set();

async function loadSearchIndex() {
  const res = await fetch('/search.json');
  const data = await res.json();
  index = data;

  // Collect unique categories and tags
  data.forEach(entry => {
    (entry.categories || []).forEach(c => categories.add(c));
    (entry.tags || []).forEach(t => tags.add(t));
  });

  renderFilters();
}

function renderFilters() {
  const catContainer = document.getElementById('categoryFilters');
  const tagContainer = document.getElementById('tagFilters');

  [...categories].forEach(cat => {
    const id = `cat-${cat}`;
    catContainer.innerHTML += `
      <label><input type="checkbox" value="${cat}" class="category-filter" id="${id}"> ${cat}</label>
    `;
  });

  [...tags].forEach(tag => {
    const id = `tag-${tag}`;
    tagContainer.innerHTML += `
      <label><input type="checkbox" value="${tag}" class="tag-filter" id="${id}"> ${tag}</label>
    `;
  });

  document.querySelectorAll('.category-filter, .tag-filter').forEach(el => {
    el.addEventListener('change', () => search(document.getElementById('searchBox').value.trim()));
  });
}

function getActiveFilters() {
  const selectedCats = [...document.querySelectorAll('.category-filter:checked')].map(el => el.value);
  const selectedTags = [...document.querySelectorAll('.tag-filter:checked')].map(el => el.value);
  return { selectedCats, selectedTags };
}

function search(query) {
  const resultsDiv = document.getElementById('results');
  const { selectedCats, selectedTags } = getActiveFilters();

  let results = index;

  if (query.length > 1) {
    results = results.filter(entry =>
      (entry.title + " " + entry.content).toLowerCase().includes(query.toLowerCase())
    );
  }

  // Filter by selected categories/tags
  if (selectedCats.length) {
    results = results.filter(entry => entry.categories.some(c => selectedCats.includes(c)));
  }
  if (selectedTags.length) {
    results = results.filter(entry => entry.tags.some(t => selectedTags.includes(t)));
  }

  // Render
  resultsDiv.innerHTML = results.length
    ? results.map(entry => `
      <div class="result">
        <a href="${entry.url}">${entry.title}</a>
        <p>${entry.content.slice(0, 150)}...</p>
      </div>`).join('')
    : "<p>No results found.</p>";
}

function showSuggestions(query) {
  const suggestions = index
    .filter(entry => entry.title.toLowerCase().includes(query.toLowerCase()))
    .slice(0, 5);

  const dropdown = document.getElementById('suggestions');
  if (query.length < 2 || suggestions.length === 0) {
    dropdown.style.display = 'none';
    return;
  }

  dropdown.innerHTML = suggestions.map(entry => `<div>${entry.title}</div>`).join('');
  dropdown.style.display = 'block';

  dropdown.querySelectorAll('div').forEach((div, i) => {
    div.addEventListener('click', () => {
      document.getElementById('searchBox').value = suggestions[i].title;
      dropdown.style.display = 'none';
      search(suggestions[i].title);
    });
  });
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  showSuggestions(q);
  search(q);
});

window.addEventListener('click', () => {
  document.getElementById('suggestions').style.display = 'none';
});

loadSearchIndex();
</script>
