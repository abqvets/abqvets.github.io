<div class="accordion-item">
  <h2 class="accordion-header" id="headingTransportation">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseTransportation" aria-expanded="false" aria-controls="collapseTransportation">
      <p class="display-9"><i class="bi-car-front-fill"></i> - Vehicles & Transportation</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseTransportation" class="accordion-collapse collapse" aria-labelledby="headingTransportation"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.transportation %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>

    </div>
  </div>
</div><!-- END Transportation -->
