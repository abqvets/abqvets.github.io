<div class="accordion-item">
  <h2 class="accordion-header" id="headingDocsForms">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseDocsForms" aria-expanded="false" aria-controls="collapseDocsForms">
      <p class="display-9"><i class="bi-file-earmark-fill"></i> - Documents and Forms</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseDocsForms" class="accordion-collapse collapse" aria-labelledby="headingDocsForms"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.docsforms %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END DocsForms -->
