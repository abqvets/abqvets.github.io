<div class="accordion-item">
  <h2 class="accordion-header" id="headingLocalAgencies">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseLocalAgencies" aria-expanded="false" aria-controls="collapseLocalAgencies">
      <p class="display-9"><i class="bi-pin-map"></i> - Local Agencies</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseLocalAgencies" class="accordion-collapse collapse" aria-labelledby="headingLocalAgencies"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.localagencies %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END LocalAgencies -->
