<div class="accordion-item">
  <h2 class="accordion-header" id="headingOutOfState">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseOutOfState" aria-expanded="false" aria-controls="collapseOutOfState">
      <p class="display-9"><i class="bi-map-fill"></i> - Out of State</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseOutOfState" class="accordion-collapse collapse" aria-labelledby="headingOutOfState"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.outofstate %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END OutOfState -->
