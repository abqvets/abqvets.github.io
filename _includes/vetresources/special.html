<div class="accordion-item">
  <h2 class="accordion-header" id="headingSpecial">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseSpecial" aria-expanded="false" aria-controls="collapseSpecial">
      <p class="display-9"><i class="bi-star-fill"></i> - Special</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseSpecial" class="accordion-collapse collapse" aria-labelledby="headingSpecial"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.special %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END Special -->
