<div class="accordion-item">
  <h2 class="accordion-header" id="headingActivities">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseActivities" aria-expanded="false" aria-controls="collapseActivities">
      <p class="display-9"><i class="bi-bicycle"></i> - Activities</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseActivities" class="accordion-collapse collapse" aria-labelledby="headingActivities"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.activities %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>

    </div>
  </div>
</div><!-- END activities -->
