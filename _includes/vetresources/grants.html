<div class="accordion-item">
  <h2 class="accordion-header" id="headingGrants">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseGrants" aria-expanded="false" aria-controls="collapseGrants">
      <p class="display-9"><i class="bi-coin"></i> - Grants</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseGrants" class="accordion-collapse collapse" aria-labelledby="headingGrants"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.grants %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END Grants -->
