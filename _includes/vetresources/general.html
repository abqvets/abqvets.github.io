<div class="accordion-item">
  <h2 class="accordion-header" id="headingGeneral">
    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
      data-bs-target="#collapseGeneral" aria-expanded="false" aria-controls="collapseGeneral">
      <p class="display-9"><i class="bi-stars"></i> - General</p> <!-- Name and Icon -->
    </button>
  </h2>
  <div id="collapseGeneral" class="accordion-collapse collapse" aria-labelledby="headingGeneral"
    data-bs-parent="#mainAccordion">
    <div class="accordion-body">
      <ul class="list-group">
        {% for resource in site.data.vetresources.general %} <!-- only change category -->
        {% include elements/card-list-loop.html %}
        {% endfor %}
      </ul>
    </div>
  </div>
</div><!-- END General -->
