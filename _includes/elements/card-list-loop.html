<li class="list-group-item">
  <div class="card mb-3" style="width: auto;">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="{{ resource.image }}" class="img-fluid rounded-start" height="60px" alt="">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title text-primary">{{ resource.title }}</h5>
          <p class="card-text">{{ resource.description }}</p>
          <a href="http://{{ resource.url }}" target="_blank" class="btn btn-primary">{{ resource.url }}</a>
          <p class="card-text"><small class="text-body-secondary">{{ resource.tags }}</small></p>
        </div>
      </div>
    </div>
  </div>
</li>
