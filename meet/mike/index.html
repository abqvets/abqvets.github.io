<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#006266">
    <meta name="theme-color" content="#3867d6" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#3867d6" media="(prefers-color-scheme: light)">
    <title>Meet Mike</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <script type="module" crossorigin src="/assets/main-JLoh3lRi.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/main-f13qz1LU.css">
  </head>
  <body>
    <main class="container py-5">
      
<style>
  body, html {
    margin: 0 !important;
    padding: 0 !important;
    width: 100%;
    height: 100%;
  }
  .hero-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/assets/coast-guard-mike-Bz0HDqS8.jpg');
    background-size: cover;
    background-position: center;
    z-index: -1;
  }
  .content-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 1;
    overflow-y: auto; /* Allows internal scrolling if card exceeds height on small screens */
  }
  .link-tree-card {
    max-width: 400px;
    width: 90%;
    margin: 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 1.5rem;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.1) !important;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
  }
  .btn-link-tree {
    position: relative;
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.75rem;
    border-radius: 50px;
    transition: all 0.3s ease;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  .btn-link-tree:hover {
    transform: translateY(-2px);
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    border-color: rgba(255, 255, 255, 0.5);
  }
  .btn-link-tree i {
    position: absolute;
    left: 1.25rem;
    font-size: 1.1rem;
  }
</style>

<div class="hero-background"></div>

<div class="content-wrapper">
  <div class="container">
    <div class="card link-tree-card shadow-lg mx-auto text-white">
      <img src="/assets/mike-CNdkF9X4.png" class="card-img-top" alt="Mike">
      <div class="card-body px-4 py-4">
        <h3 class="text-center mb-4 fw-bold">Hi there!</h3>

        <div class="d-grid gap-2">
          <a href="#" class="btn btn-outline-light btn-link-tree text-center">
            <i class="bi bi-globe"></i> Website
          </a>
          <a href="#" class="btn btn-outline-light btn-link-tree text-center">
            <i class="bi bi-linkedin"></i> LinkedIn
          </a>
          <a href="#" class="btn btn-outline-light btn-link-tree text-center">
            <i class="bi bi-facebook"></i> Facebook
          </a>
          <a href="#" class="btn btn-outline-light btn-link-tree text-center">
            <i class="bi bi-instagram"></i> Instagram
          </a>
          <a href="#" class="btn btn-light btn-link-tree text-center text-dark mt-2">
            <i class="bi bi-envelope"></i> Contact Me
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
